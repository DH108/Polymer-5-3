<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2d4a1e">
<title>高分子材料改性 · 互动课堂</title>
<style>
/* ══════════════════════════════════════════
   星露谷风格 · 高分子互动课堂
   Stardew Valley Inspired CSS
══════════════════════════════════════════ */

@import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap');

:root {
  --sdv-brown:    #5c3d1e;
  --sdv-tan:      #c8a86a;
  --sdv-cream:    #f5e6c8;
  --sdv-green:    #4a7c3f;
  --sdv-dkgreen:  #2d4a1e;
  --sdv-ltgreen:  #8db87a;
  --sdv-blue:     #4a6fa5;
  --sdv-ltblue:   #8ab4d8;
  --sdv-red:      #8b2f2f;
  --sdv-gold:     #d4a818;
  --sdv-shadow:   rgba(0,0,0,0.6);
  --sdv-ui-bg:    rgba(26,18,8,0.92);
  --pixel: 2px;
}

* { margin:0; padding:0; box-sizing:border-box; }

/* ── 像素字体渲染 ── */
body {
  font-family: 'Ma Shan Zheng', 'ZCOOL KuaiLe', 'Microsoft YaHei', sans-serif;
  background: var(--sdv-dkgreen);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
  image-rendering: pixelated;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

/* ══════ 主容器 - 手机优先 ══════ */
#game-wrap {
  position: relative;
  width: 100vw;
  height: 100vh;
  max-width: 480px;
  max-height: 850px;
  overflow: hidden;
  background: #1a1208;
}

@media (min-width: 500px) {
  body { background: #1a1208; }
  #game-wrap {
    border: 4px solid var(--sdv-brown);
    box-shadow:
      0 0 0 2px var(--sdv-tan),
      0 0 0 4px var(--sdv-brown),
      0 20px 60px rgba(0,0,0,0.8);
    border-radius: 4px;
  }
}

/* ══════ 背景场景 ══════ */
#scene-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center top;
  transition: opacity 0.6s ease;
  z-index: 0;
  image-rendering: pixelated;
}
#scene-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    transparent 0%,
    transparent 50%,
    rgba(10,7,2,0.5) 75%,
    rgba(10,7,2,0.85) 100%
  );
  z-index: 1;
  pointer-events: none;
}

/* ══════ 标题页 ══════ */
#title-screen {
  position: absolute;
  inset: 0;
  z-index: 100;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: opacity 0.5s ease;
  background: #0d0a04;
}
#title-screen.hidden {
  opacity: 0;
  pointer-events: none;
}
#title-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  opacity: 0.7;
  image-rendering: pixelated;
}
#title-content {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 20px;
}
.title-badge {
  display: inline-block;
  background: var(--sdv-dkgreen);
  border: 3px solid var(--sdv-tan);
  border-radius: 0;
  padding: 6px 16px;
  color: var(--sdv-tan);
  font-size: 0.75em;
  letter-spacing: 0.15em;
  margin-bottom: 12px;
  /* 像素框阴影 */
  box-shadow: 3px 3px 0 var(--sdv-brown), -1px -1px 0 rgba(255,255,255,0.1);
}
.title-main {
  font-size: clamp(1.6em, 7vw, 2.4em);
  color: var(--sdv-cream);
  text-shadow:
    2px 2px 0 var(--sdv-brown),
    4px 4px 0 rgba(0,0,0,0.5);
  line-height: 1.2;
  margin-bottom: 6px;
}
.title-sub {
  font-size: clamp(0.85em, 3.5vw, 1.05em);
  color: var(--sdv-ltgreen);
  text-shadow: 1px 1px 0 #000;
  margin-bottom: 30px;
}
.title-start-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--sdv-green);
  border: 3px solid var(--sdv-cream);
  color: var(--sdv-cream);
  padding: 12px 28px;
  font-family: inherit;
  font-size: 1.1em;
  cursor: pointer;
  /* 像素按钮 */
  box-shadow: 4px 4px 0 var(--sdv-dkgreen);
  transition: transform 0.1s, box-shadow 0.1s;
  animation: pulse-btn 2s ease-in-out infinite;
}
.title-start-btn:active {
  transform: translate(2px, 2px);
  box-shadow: 2px 2px 0 var(--sdv-dkgreen);
}
@keyframes pulse-btn {
  0%,100% { box-shadow: 4px 4px 0 var(--sdv-dkgreen); }
  50% { box-shadow: 4px 4px 0 var(--sdv-dkgreen), 0 0 15px var(--sdv-ltgreen); }
}
.title-credit {
  position: absolute;
  bottom: 20px;
  left: 0; right: 0;
  text-align: center;
  color: rgba(200,168,106,0.5);
  font-size: 0.72em;
  z-index: 2;
}

/* ══════ 角色立绘区 ══════ */
#character-area {
  position: absolute;
  bottom: 220px;
  left: 0; right: 0;
  height: 240px;
  z-index: 5;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  pointer-events: none;
}
#char-sprite {
  height: 100%;
  max-width: 200px;
  object-fit: contain;
  image-rendering: pixelated;
  filter: drop-shadow(3px 3px 0 rgba(0,0,0,0.5));
  transition: transform 0.3s ease, opacity 0.4s ease;
}
#char-sprite.hidden { opacity: 0; }
#char-sprite.talking {
  animation: char-talk 0.4s ease-in-out infinite alternate;
}
@keyframes char-talk {
  from { transform: translateY(0); }
  to   { transform: translateY(-3px); }
}
#char-sprite.happy {
  animation: char-happy 0.5s ease-in-out 3;
}
@keyframes char-happy {
  0%   { transform: scale(1) rotate(0deg); }
  25%  { transform: scale(1.05) rotate(-2deg); }
  75%  { transform: scale(1.05) rotate(2deg); }
  100% { transform: scale(1) rotate(0deg); }
}

/* ══════ 设备/图片展示区 ══════ */
#scene-image-area {
  position: absolute;
  top: 5%;
  left: 5%; right: 5%;
  height: 45%;
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.4s ease, transform 0.4s ease;
  pointer-events: none;
}
#scene-image-area.show {
  opacity: 1;
  transform: translateY(0);
}
#scene-image {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  image-rendering: pixelated;
  border: 3px solid var(--sdv-tan);
  box-shadow:
    4px 4px 0 var(--sdv-brown),
    0 8px 20px rgba(0,0,0,0.5);
  background: rgba(0,0,0,0.3);
}
#scene-svg {
  max-width: 100%;
  max-height: 100%;
}

/* ══════ 知识卡片 ══════ */
#knowledge-panel {
  position: absolute;
  inset: 10px;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
#knowledge-panel.show {
  opacity: 1;
  pointer-events: auto;
}
.knowledge-card {
  background: var(--sdv-ui-bg);
  border: 3px solid var(--sdv-tan);
  box-shadow:
    5px 5px 0 var(--sdv-brown),
    inset 0 0 0 1px rgba(200,168,106,0.1);
  padding: 20px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  position: relative;
}
.kc-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 2px solid rgba(200,168,106,0.3);
}
.kc-icon { font-size: 1.8em; }
.kc-title {
  color: var(--sdv-tan);
  font-size: 1.1em;
  text-shadow: 1px 1px 0 #000;
}
.kc-body {
  color: var(--sdv-cream);
  font-size: 0.9em;
  line-height: 1.75;
}
.kc-body p { margin-bottom: 10px; }
.kc-body b { color: var(--sdv-gold); }
.kc-close-btn {
  display: block;
  width: 100%;
  margin-top: 14px;
  padding: 10px;
  background: var(--sdv-green);
  border: 3px solid var(--sdv-cream);
  color: var(--sdv-cream);
  font-family: inherit;
  font-size: 1em;
  cursor: pointer;
  box-shadow: 3px 3px 0 var(--sdv-dkgreen);
  transition: transform 0.1s, box-shadow 0.1s;
}
.kc-close-btn:active {
  transform: translate(2px, 2px);
  box-shadow: 1px 1px 0 var(--sdv-dkgreen);
}

/* ══════ 对话框 ══════ */
#dialogue-area {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  z-index: 20;
  padding: 0 10px 10px;
}
.dialogue-box {
  background: var(--sdv-ui-bg);
  border: 3px solid var(--sdv-tan);
  box-shadow:
    4px 4px 0 var(--sdv-brown),
    inset 0 0 0 1px rgba(200,168,106,0.08);
  padding: 12px 14px 14px;
  position: relative;
  min-height: 110px;
}
.dialogue-box::before {
  content: '';
  position: absolute;
  top: -3px; left: -3px;
  width: 10px; height: 10px;
  background: var(--sdv-tan);
}
.dialogue-box::after {
  content: '';
  position: absolute;
  bottom: -3px; right: -3px;
  width: 10px; height: 10px;
  background: var(--sdv-tan);
}

/* 角色名牌 */
.speaker-name {
  display: inline-block;
  background: var(--sdv-green);
  border: 2px solid var(--sdv-tan);
  color: var(--sdv-cream);
  padding: 3px 12px;
  font-size: 0.85em;
  margin-bottom: 8px;
  box-shadow: 2px 2px 0 var(--sdv-dkgreen);
}
.speaker-name.system-tag {
  background: var(--sdv-blue);
  border-color: var(--sdv-ltblue);
}
.speaker-name.report-tag {
  background: #4a6b4a;
  border-color: var(--sdv-ltgreen);
}

/* 对话文字 */
#dialogue-text {
  color: var(--sdv-cream);
  font-size: clamp(0.85em, 3.5vw, 1em);
  line-height: 1.7;
  min-height: 50px;
}
#dialogue-text b { color: var(--sdv-gold); }
#dialogue-text .good { color: #7ddf90; }
#dialogue-text .warn { color: #e8d5a0; }
#dialogue-text .bad  { color: #e06060; }

/* 继续提示 */
#next-hint {
  position: absolute;
  bottom: 8px;
  right: 12px;
  color: var(--sdv-tan);
  font-size: 0.8em;
  animation: blink-hint 1.2s ease-in-out infinite;
  pointer-events: none;
}
@keyframes blink-hint {
  0%,100% { opacity: 0.3; transform: translateX(0); }
  50%     { opacity: 1;   transform: translateX(3px); }
}

/* ══════ 选项区域 ══════ */
#choices-area {
  position: absolute;
  bottom: 140px; left: 0; right: 0;
  z-index: 30;
  padding: 8px 10px 10px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  background: linear-gradient(to top, rgba(10,7,2,0.85) 60%, transparent);
  border-top: 2px solid rgba(200,168,106,0.25);
  max-height: 55vh;
  overflow-y: auto;
}
#choices-area.show {
  opacity: 1;
  pointer-events: auto;
}
.choice-btn {
  width: 100%;
  background: rgba(26,18,8,0.9);
  border: 2px solid var(--sdv-tan);
  color: var(--sdv-cream);
  padding: 10px 14px;
  font-family: inherit;
  font-size: clamp(0.8em, 3.2vw, 0.92em);
  text-align: left;
  cursor: pointer;
  box-shadow: 3px 3px 0 var(--sdv-brown);
  transition: all 0.1s ease;
  line-height: 1.4;
  position: relative;
  overflow: hidden;
}
.choice-btn::before {
  content: '▶';
  color: var(--sdv-tan);
  margin-right: 8px;
  font-size: 0.7em;
  opacity: 0;
  transition: opacity 0.15s;
}
.choice-btn:hover::before,
.choice-btn:focus::before { opacity: 1; }
.choice-btn:hover, .choice-btn:focus {
  background: rgba(74,124,63,0.85);
  border-color: var(--sdv-cream);
  outline: none;
}
.choice-btn:active {
  transform: translate(2px, 2px);
  box-shadow: 1px 1px 0 var(--sdv-brown);
}
.choice-hint {
  display: block;
  color: rgba(200,168,106,0.65);
  font-size: 0.8em;
  margin-top: 2px;
}

/* ══════ HUD - 路径/进度指示 ══════ */
#hud {
  position: absolute;
  top: 8px; right: 8px;
  z-index: 15;
  display: flex;
  gap: 5px;
  opacity: 0;
  transition: opacity 0.5s;
}
#hud.show { opacity: 1; }
.hud-dot {
  width: 9px; height: 9px;
  border: 2px solid var(--sdv-brown);
  background: var(--sdv-brown);
  transition: background 0.3s, border-color 0.3s;
}
.hud-dot.done { background: var(--sdv-tan); border-color: var(--sdv-cream); }
.hud-dot.fail { background: var(--sdv-red); border-color: #e06060; }

/* ══════ 评分显示 ══════ */
#score-display {
  position: absolute;
  top: 8px; left: 8px;
  z-index: 15;
  background: var(--sdv-ui-bg);
  border: 2px solid var(--sdv-tan);
  padding: 4px 10px;
  color: var(--sdv-gold);
  font-size: 0.78em;
  box-shadow: 2px 2px 0 var(--sdv-brown);
  opacity: 0;
  transition: opacity 0.5s;
}
#score-display.show { opacity: 1; }

/* ══════ 结果画面 ══════ */
#result-screen {
  position: absolute;
  inset: 0;
  z-index: 90;
  background: rgba(0,0,0,0.92);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.6s ease;
}
#result-screen.show {
  opacity: 1;
  pointer-events: auto;
}
.result-card {
  background: var(--sdv-ui-bg);
  border: 3px solid var(--sdv-tan);
  box-shadow: 6px 6px 0 var(--sdv-brown);
  padding: 24px;
  width: 100%;
  max-width: 380px;
  text-align: center;
}
.result-grade {
  font-size: 3.5em;
  margin: 10px 0;
}
.result-title {
  color: var(--sdv-tan);
  font-size: 1.3em;
  margin-bottom: 12px;
  text-shadow: 2px 2px 0 #000;
}
.result-detail {
  color: var(--sdv-cream);
  font-size: 0.88em;
  line-height: 1.8;
  text-align: left;
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(200,168,106,0.2);
  padding: 12px;
  margin-bottom: 14px;
}
.result-detail b { color: var(--sdv-gold); }
.result-score-bar {
  height: 12px;
  background: var(--sdv-brown);
  border: 2px solid var(--sdv-tan);
  margin: 8px 0 14px;
  position: relative;
  overflow: hidden;
}
.result-score-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  background: linear-gradient(to right, var(--sdv-green), var(--sdv-gold));
  transition: width 1s ease 0.5s;
}
.result-path {
  color: rgba(200,168,106,0.7);
  font-size: 0.78em;
  margin-bottom: 14px;
  line-height: 1.6;
}
.restart-btn {
  width: 100%;
  background: var(--sdv-green);
  border: 3px solid var(--sdv-cream);
  color: var(--sdv-cream);
  padding: 12px;
  font-family: inherit;
  font-size: 1em;
  cursor: pointer;
  box-shadow: 4px 4px 0 var(--sdv-dkgreen);
  transition: transform 0.1s, box-shadow 0.1s;
}
.restart-btn:active {
  transform: translate(2px, 2px);
  box-shadow: 2px 2px 0 var(--sdv-dkgreen);
}

/* ══════ 打字机动效 ══════ */
@keyframes cursor-blink {
  0%,100% { opacity: 1; }
  50% { opacity: 0; }
}
.typing-cursor {
  display: inline-block;
  width: 2px;
  height: 1em;
  background: var(--sdv-tan);
  vertical-align: middle;
  margin-left: 2px;
  animation: cursor-blink 0.7s ease-in-out infinite;
}

/* ══════ 通知提示 ══════ */
#toast {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: var(--sdv-ui-bg);
  border: 3px solid var(--sdv-gold);
  box-shadow: 5px 5px 0 var(--sdv-brown);
  padding: 14px 24px;
  color: var(--sdv-cream);
  font-size: 1em;
  z-index: 80;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
#toast.show { opacity: 1; }

/* ══════ 响应式微调 ══════ */
@media (max-height: 680px) {
  #character-area { height: 190px; bottom: 200px; }
  .dialogue-box { min-height: 95px; padding: 9px 12px 12px; }
  #dialogue-text { font-size: 0.82em; }
  .choice-btn { padding: 8px 12px; }
}
@media (min-width: 500px) and (min-height: 700px) {
  #character-area { height: 260px; }
}

/* ══════ 滚动条美化 ══════ */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--sdv-brown); }
::-webkit-scrollbar-thumb { background: var(--sdv-tan); }

/* ══════ 像素风装饰 ══════ */
.pixel-corner-tl::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 8px; height: 8px;
  border-top: 3px solid var(--sdv-tan);
  border-left: 3px solid var(--sdv-tan);
}
</style>
</head>
<body>
<div id="game-wrap">
  <!-- 背景场景 -->
  <div id="scene-bg"></div>
  <div id="scene-overlay"></div>

  <!-- ── 标题页 ── -->
  <div id="title-screen">
    <div id="title-bg"></div>
    <div id="title-content">
      <div class="title-badge">📚 《高分子材料改性》互动课堂</div>
      <div class="title-main">聚合物共混改性</div>
      <div class="title-sub">汽车保险杠材料开发实战</div>
      <button class="title-start-btn" onclick="startGame()">
        ▶ 开始挑战
      </button>
    </div>
    <div class="title-credit">河南大学功能材料中心 · 课堂互动案例</div>
  </div>

  <!-- ── HUD ── -->
  <div id="hud"></div>
  <div id="score-display">⭐ 0 分</div>

  <!-- ── 场景图片 ── -->
  <div id="scene-image-area">
    <img id="scene-image" src="" alt="" style="display:none">
    <div id="scene-svg"></div>
  </div>

  <!-- ── 角色立绘 ── -->
  <div id="character-area">
    <img id="char-sprite" src="" alt="王工" class="hidden">
  </div>

  <!-- ── 知识卡片 ── -->
  <div id="knowledge-panel">
    <div class="knowledge-card">
      <div class="kc-header">
        <span class="kc-icon" id="kc-icon">📚</span>
        <span class="kc-title" id="kc-title"></span>
      </div>
      <div class="kc-body" id="kc-body"></div>
      <button class="kc-close-btn" onclick="closeKnowledge()">✅ 明白了，继续！</button>
    </div>
  </div>

  <!-- ── 对话区域 ── -->
  <div id="dialogue-area">
    <div class="dialogue-box" id="dialogue-box" onclick="handleDialogueClick()">
      <div class="speaker-name" id="speaker-tag">王工</div>
      <div id="dialogue-text"></div>
      <div id="next-hint">▶▶</div>
    </div>
  </div>

  <!-- ── 选项区域 ── -->
  <div id="choices-area"></div>

  <!-- ── 结果画面 ── -->
  <div id="result-screen">
    <div class="result-card">
      <div class="result-grade" id="result-grade">🏆</div>
      <div class="result-title" id="result-title"></div>
      <div class="result-score-bar">
        <div class="result-score-fill" id="result-fill" style="width:0%"></div>
      </div>
      <div class="result-detail" id="result-detail"></div>
      <div class="result-path" id="result-path"></div>
      <button class="restart-btn" onclick="restartGame()">🔄 重新挑战</button>
    </div>
  </div>

  <!-- ── 提示Toast ── -->
  <div id="toast"></div>
</div>

<script>
// ════════════════════════════════════════════════
//  图片资源映射
// ════════════════════════════════════════════════

// ════════════════════════════════════════════════
//  HUD 进度更新
// ════════════════════════════════════════════════
function updateHUD(step, status){
  const hud = document.getElementById('hud');
  const dots = hud.querySelectorAll('.hud-dot');
  if(dots[step-1]){
    dots[step-1].classList.remove('done','fail');
    dots[step-1].classList.add(status);
  }
}

// ════════════════════════════════════════════════
//  打字机效果
// ════════════════════════════════════════════════
function typeText(el, html, onDone){
  // 解析成纯文本用于打字，然后最终替换为完整HTML
  clearTimeout(G.typeTimer);
  const temp = document.createElement('div');
  temp.innerHTML = html;
  const plainText = temp.textContent;

  el.innerHTML = '';
  G.typing = true;
  let i = 0;
  const speed = 28; // ms per char

  function tick(){
    if(i < plainText.length){
      // 显示纯文本进度，最后才替换HTML
      el.textContent = plainText.substring(0, i+1);
      i++;
      G.typeTimer = setTimeout(tick, speed);
    } else {
      el.innerHTML = html; // 替换为完整HTML（含标签）
      G.typing = false;
      if(onDone) onDone();
    }
  }
  tick();
}

function skipType(el, html){
  clearTimeout(G.typeTimer);
  G.typing = false;
  el.innerHTML = html;
}

// ════════════════════════════════════════════════
//  场景切换
// ════════════════════════════════════════════════
function setBG(key){
  const bg = document.getElementById('scene-bg');
  const src = IMGS['bg_'+key];
  if(src) bg.style.backgroundImage = `url('${src}')`;
}

function setChar(key, emotion){
  const sprite = document.getElementById('char-sprite');
  const src = IMGS['wang_'+(emotion||key)];
  if(!src){ sprite.classList.add('hidden'); return; }
  sprite.src = src;
  sprite.classList.remove('hidden');
}

function setSceneImage(key){
  const area = document.getElementById('scene-image-area');
  const img = document.getElementById('scene-image');
  const svg = document.getElementById('scene-svg');
  const src = IMGS[key];
  if(src){
    img.src = src;
    img.style.display = 'block';
    svg.innerHTML = '';
    area.classList.add('show');
  } else {
    area.classList.remove('show');
  }
}

function setSeaIsland(type){
  const area = document.getElementById('scene-image-area');
  const img = document.getElementById('scene-image');
  const svg = document.getElementById('scene-svg');
  img.style.display = 'none';
  svg.innerHTML = SEA_ISLAND_SVG[type] || '';
  area.classList.add('show');
}

// ════════════════════════════════════════════════
function showKnowledge(kc, onClose){
  document.getElementById('kc-icon').textContent = kc.icon;
  document.getElementById('kc-title').textContent = kc.title;
  document.getElementById('kc-body').innerHTML = kc.body;
  document.getElementById('knowledge-panel').classList.add('show');
  G._kcCloseCallback = onClose;
}
function closeKnowledge(){
  document.getElementById('knowledge-panel').classList.remove('show');
  if(G._kcCloseCallback){
    const cb = G._kcCloseCallback;
    G._kcCloseCallback = null;
    cb();
  }
}

// ════════════════════════════════════════════════
//  显示选项
// ════════════════════════════════════════════════
function showChoices(choices){
  const area = document.getElementById('choices-area');
  area.innerHTML = '';
  // 不隐藏对话框，选项浮在对话框上方，介绍文字仍可见

  choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `${c.text}${c.hint ? `<span class="choice-hint">${c.hint}</span>` : ''}`;
    btn.onclick = () => {
      if(c.score && c.score > 0) G.path.score += c.score;
      choiceSelected(c);
    };
    area.appendChild(btn);
  });
  area.classList.add('show');
  document.getElementById('next-hint').style.opacity = '0';
}
function hideChoices(){
  const area = document.getElementById('choices-area');
  area.classList.remove('show');
  area.innerHTML = '';
}
function choiceSelected(choice){
  hideChoices();
  goTo(choice.next);
}

// ════════════════════════════════════════════════
//  核心节点渲染
// ════════════════════════════════════════════════
function goTo(nodeId){
  if(nodeId === '__END__'){
    showResult();
    return;
  }
  const node = NODES[nodeId];
  if(!node){ console.warn('Missing node:', nodeId); return; }

  G.node = nodeId;

  // 执行 onEnter 回调
  if(node.onEnter) node.onEnter();

  // 背景切换
  if(node.bg) setBG(node.bg);

  // 角色立绘
  if(node.char){
    const spriteEl = document.getElementById('char-sprite');
    const emotion = node.char.replace('wang_','');
    setChar('normal', emotion);
    // 情绪动画
    spriteEl.className = '';
    if(emotion==='happy') spriteEl.classList.add('happy');
  }

  // 场景图片 / SEM图
  if(node.sceneImg){
    setSceneImage(node.sceneImg);
  } else if(node.seaIsland){
    setSeaIsland(node.seaIsland);
  } else {
    document.getElementById('scene-image-area').classList.remove('show');
  }

  // 说话人标签
  const tag = document.getElementById('speaker-tag');
  tag.textContent = node.speaker || '系统';
  tag.className = 'speaker-name';
  if(node.tag==='system') tag.classList.add('system-tag');
  if(node.tag==='report') tag.classList.add('report-tag');

  // 更新积分显示
  document.getElementById('score-display').textContent = `⭐ ${G.path.score} 分`;

  // 对话文字（打字效果）
  const textEl = document.getElementById('dialogue-text');
  const nextHint = document.getElementById('next-hint');
  nextHint.style.opacity = '0';

  const rawText = (node.text||'').replace(/\n/g,'<br>');
  typeText(textEl, rawText, () => {
    nextHint.style.opacity = '1';
    afterTypeDone(node);
  });
}

function afterTypeDone(node){
  const nextHint = document.getElementById('next-hint');
  nextHint.style.opacity = '1';

  if(node.knowledge){
    // 有知识卡：先点击继续，再弹知识卡，再处理后续
    nextHint.style.opacity = '1'; // 提示用户点击
    G.awaitClick = true;
    G.pendingCallback = () => {
      nextHint.style.opacity = '0';
      showKnowledge(node.knowledge, () => {
        // 知识卡关闭后，显示选项或继续
        if(node.choices){
          showChoices(node.choices);
        } else if(node.resolve){
          const next = node.resolve();
          goTo(next);
        } else if(node.next){
          goTo(node.next);
        }
      });
    };
  } else if(node.choices){
    // 有选项但无知识：打完后等一下显示选项
    G.awaitClick = false;
    G.pendingNext = null;
    setTimeout(() => showChoices(node.choices), 200);
  } else if(node.resolve){
    // 逻辑分支节点
    G.awaitClick = false;
    setTimeout(() => {
      const next = node.resolve();
      goTo(next);
    }, 800);
  } else {
    // 普通点击继续
    G.awaitClick = true;
    G.pendingNext = node.next;
    G.pendingCallback = null;
  }
}

function proceedAfterNode(node){
  if(node.choices){
    showChoices(node.choices);
  } else if(node.next){
    goTo(node.next);
  }
}

// 处理对话框点击
function handleDialogueClick(){
  if(G.typing){
    // 快进打字
    const node = NODES[G.node];
    if(node){
      const textEl = document.getElementById('dialogue-text');
      skipType(textEl, (node.text||'').replace(/\n/g,'<br>'));
      const nextHint = document.getElementById('next-hint');
      nextHint.style.opacity = '1';
      G.typing = false;
      // 重新触发打字完成逻辑
      afterTypeDone(node);
    }
    return;
  }
  if(G.awaitClick){
    G.awaitClick = false;
    if(G.pendingCallback){
      const cb = G.pendingCallback;
      G.pendingCallback = null;
      cb();
    } else if(G.pendingNext){
      const next = G.pendingNext;
      G.pendingNext = null;
      goTo(next);
    }
  }
}

//  游戏控制
// ════════════════════════════════════════════════
function startGame(){
  document.getElementById('title-screen').classList.add('hidden');
  document.getElementById('dialogue-area').style.display = '';
  document.getElementById('hud').classList.add('show');
  document.getElementById('score-display').classList.add('show');

  // 初始化HUD（3步）
  const hud = document.getElementById('hud');
  hud.innerHTML = '';
  ['设备','增韧剂','参数'].forEach((label, i) => {
    const dot = document.createElement('div');
    dot.className = 'hud-dot';
    dot.title = `第${i+1}步：${label}`;
    hud.appendChild(dot);
  });

  goTo('start');
}

function restartGame(){
  // 重置状态
  G.node = null;
  G.typing = false;
  G.pendingNext = null;
  G.pendingCallback = null;
  G.awaitClick = false;
  G.path = { equipment:null, modifier:null, compatibilizer:null, params:null, score:0, detours:[], steps:0 };
  G.compatLevel = null;
  G.testResult = null;
  G.morphDiagram = null;

  document.getElementById('result-screen').classList.remove('show');
  document.getElementById('result-fill').style.width = '0%';
  document.getElementById('scene-image-area').classList.remove('show');
  document.getElementById('hud').querySelectorAll('.hud-dot').forEach(d => {
    d.classList.remove('done','fail');
  });
  hideChoices();
  closeKnowledge();

  goTo('start');
}
